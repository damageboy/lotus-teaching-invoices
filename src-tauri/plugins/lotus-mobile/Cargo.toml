[package]
name = "tauri-plugin-lotus-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-lotus-mobile"

[lib]
name = "tauri_plugin_lotus_mobile"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
