name: Build Android release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Scan tracked source for OAuth client secrets
        run: bun run verify:oauth-source

      - name: Inject tag version into tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            const parts = process.env.TAG.replace(/^v/, '').split('.');
            while (parts.length < 3) parts.push('0');
            cfg.version = parts.join('.');
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
          "
        env:
          TAG: ${{ github.ref_name }}

      - name: Configure Android signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_BASE64"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEY_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/lotus-upload.jks"

          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'password=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/lotus-upload.jks"
          } > src-tauri/gen/android/keystore.properties

      - name: Build ARM64 release APK
        run: NDK_HOME="$ANDROID_NDK_HOME" bunx tauri android build --apk --target aarch64
        env:
          CI: true

      - name: Verify release APK
        id: release
        run: |
          mapfile -t apks < <(
            find src-tauri/gen/android/app/build/outputs/apk \
              -type f -name '*.apk' \
              ! -name '*-unsigned.apk' \
              ! -name '*androidTest*.apk'
          )
          if [[ "${#apks[@]}" -ne 1 ]]; then
            printf 'Expected exactly one signed release APK, found %d\n' "${#apks[@]}" >&2
            exit 1
          fi

          apk="${apks[0]}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [[ -z "$apksigner" ]]; then
            printf 'apksigner was not found\n' >&2
            exit 1
          fi

          "$apksigner" verify --verbose --print-certs "$apk"
          bun run verify:android-oauth-artifact "$apk"
          sha256sum "$apk"
          printf 'apk=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lotus-android-arm64-release
          path: ${{ steps.release.outputs.apk }}
          if-no-files-found: error

      - name: Prepare GitHub Release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APK: ${{ steps.release.outputs.apk }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p release-assets
          cp "$APK" "release-assets/Lotus.Teaching.Invoices_${VERSION}_android-arm64.apk"

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: release-assets/*.apk
          fail_on_unmatched_files: true
